<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pendaftaran Wajah - RailGate</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .camera-corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: var(--orange);
            border-style: solid;
            pointer-events: none;
            z-index: 3;
        }

        .corner-tl { top: 12px; left: 12px; border-width: 3px 0 0 3px; }
        .corner-tr { top: 12px; right: 12px; border-width: 3px 3px 0 0; }
        .corner-bl { bottom: 12px; left: 12px; border-width: 0 0 3px 3px; }
        .corner-br { bottom: 12px; right: 12px; border-width: 0 3px 3px 0; }

        .guide-checklist {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin-top: 20px;
            text-align: left;
        }

        .guide-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--surface-alt);
            padding: 8px 12px;
            border-radius: var(--radius);
        }

        .guide-item svg {
            flex-shrink: 0;
            color: var(--green);
        }
    </style>
</head>

<body>
    <div class="speed-stripes">
        <div class="stripe-navy"></div>
        <div class="stripe-orange"></div>
    </div>

    <nav>
        <a href="/dashboard.html" class="brand">
            <span class="brand-icon-wrapper">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="3" width="16" height="15" rx="3"></rect>
                    <line x1="8" y1="8" x2="16" y2="8"></line>
                    <circle cx="8" cy="14" r="1.5" fill="currentColor"></circle>
                    <circle cx="16" cy="14" r="1.5" fill="currentColor"></circle>
                    <path d="M7 18 L4 21"></path>
                    <path d="M17 18 L20 21"></path>
                </svg>
            </span>
            <span>Rail<span class="brand-accent">Gate</span></span>
        </a>

        <div class="nav-links">
            <a href="/dashboard.html">Dashboard</a>
            <a href="/booking.html">Pesan Tiket</a>
            <a href="/my-tickets.html">Tiket Saya</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </nav>

    <main>
        <div class="card face-card">
            <!-- 3-STEP VISUAL PROGRESS INDICATOR -->
            <div class="enroll-steps">
                <div class="enroll-step-item active" id="step1">
                    <div class="enroll-step-number">1</div>
                    <div class="enroll-step-text">Kamera</div>
                </div>
                <div class="enroll-step-item" id="step2">
                    <div class="enroll-step-number">2</div>
                    <div class="enroll-step-text">Posisi Wajah</div>
                </div>
                <div class="enroll-step-item" id="step3">
                    <div class="enroll-step-number">3</div>
                    <div class="enroll-step-text">Tervalidasi</div>
                </div>
            </div>

            <h2>Registrasi Biometrik Wajah</h2>
            <p>
                Posisikan wajah Anda tepat di dalam area panduan oval.
                Data biometrik digunakan untuk boarding cepat di stasiun.
            </p>

            <div class="face-camera" id="faceCameraBox">
                <video id="faceVideo" autoplay playsinline muted></video>
                <div class="face-guide"></div>

                <!-- SUDUT BINGKAI TARGET PEMINDAI -->
                <div class="camera-corner corner-tl"></div>
                <div class="camera-corner corner-tr"></div>
                <div class="camera-corner corner-bl"></div>
                <div class="camera-corner corner-br"></div>

                <!-- GARIS LASER PEMINDAI ANIMATIF -->
                <div class="scan-laser" id="scanLaser"></div>
            </div>

            <p id="faceStatus" class="face-status">Kamera belum diaktifkan</p>

            <div class="btn-group">
                <button id="startFaceCamera" type="button" class="btn btn-secondary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="23 7 16 12 23 17 23 7"></polygon>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                    </svg>
                    Aktifkan Kamera
                </button>

                <button id="captureFace" type="button" class="btn" disabled>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    Daftarkan Wajah
                </button>
            </div>

            <!-- PANDUAN CEPAT DENGAN CHECKLIST IKON -->
            <div class="guide-checklist">
                <div class="guide-item">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    <span>Cahaya terang</span>
                </div>
                <div class="guide-item">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    <span>Lepas masker</span>
                </div>
                <div class="guide-item">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    <span>Tatap kamera</span>
                </div>
            </div>
        </div>
    </main>

    <script src="/static/js/auth.js"></script>
    <script>
        requireLogin();

        const video = document.getElementById("faceVideo");
        const statusText = document.getElementById("faceStatus");
        const captureButton = document.getElementById("captureFace");
        const startButton = document.getElementById("startFaceCamera");
        const cameraBox = document.getElementById("faceCameraBox");

        const step1 = document.getElementById("step1");
        const step2 = document.getElementById("step2");
        const step3 = document.getElementById("step3");

        let cameraStream = null;

        startButton.addEventListener("click", async () => {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "user"
                    },
                    audio: false
                });

                video.srcObject = cameraStream;
                await video.play();

                cameraBox.classList.add("scanning");
                statusText.textContent = "Posisikan wajah Anda di dalam lingkaran panduan";
                captureButton.disabled = false;

                step2.classList.add("active");

            } catch (error) {
                statusText.textContent = "Kamera gagal dibuka: " + error.message;
            }
        });

        captureButton.addEventListener("click", async () => {
            if (!cameraStream || video.readyState < 2) {
                statusText.textContent = "Aktifkan kamera terlebih dahulu";
                return;
            }

            captureButton.disabled = true;
            statusText.textContent = "Memproses identifikasi biometrik wajah...";

            if (video.videoWidth < 160 || video.videoHeight < 160) {
                statusText.textContent = "Resolusi kamera terlalu rendah. Minimal 160x160 piksel.";
                captureButton.disabled = false;
                return;
            }

            try {
                const canvas = document.createElement("canvas");
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                const ctx = canvas.getContext("2d");
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const blob = await new Promise(resolve => {
                    canvas.toBlob(resolve, "image/jpeg", 0.9);
                });

                if (!blob) {
                    throw new Error("Gagal mengambil foto dari kamera");
                }

                const formData = new FormData();
                formData.append("file", blob, "face.jpg");

                const result = await apiRequest("/face/enroll", {
                    method: "POST",
                    body: formData
                });

                if (result.face_registered === true) {
                    statusText.textContent = "Wajah berhasil didaftarkan ke sistem KAI!";
                    statusText.style.color = "var(--green)";

                    step3.classList.add("active");
                    cameraBox.classList.remove("scanning");

                    captureButton.disabled = true;
                    startButton.disabled = true;

                    if (cameraStream) {
                        cameraStream.getTracks().forEach(track => track.stop());
                        cameraStream = null;
                    }

                    video.srcObject = null;
                } else {
                    statusText.textContent = "Pendaftaran belum selesai";
                    captureButton.disabled = false;
                }

            } catch (error) {
                statusText.textContent = error.message;
                statusText.style.color = "var(--red)";
                captureButton.disabled = false;
            }
        });

        window.addEventListener("pagehide", () => {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>

</html>
