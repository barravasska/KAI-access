<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tiket Saya - RailGate</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="speed-stripes">
        <div class="stripe-navy"></div>
        <div class="stripe-orange"></div>
    </div>

    <nav>
        <a href="/dashboard.html" class="brand">
            <span class="brand-icon-wrapper">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="3" width="16" height="15" rx="3"></rect>
                    <line x1="8" y1="8" x2="16" y2="8"></line>
                    <circle cx="8" cy="14" r="1.5" fill="currentColor"></circle>
                    <circle cx="16" cy="14" r="1.5" fill="currentColor"></circle>
                    <path d="M7 18 L4 21"></path>
                    <path d="M17 18 L20 21"></path>
                </svg>
            </span>
            <span>Rail<span class="brand-accent">Gate</span></span>
        </a>

        <div class="nav-links">
            <a href="/dashboard.html">Dashboard</a>
            <a href="/booking.html">Pesan Tiket</a>
            <a href="/my-tickets.html" class="active">Tiket Saya</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </nav>

    <main>
        <div class="page-header">
            <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
                <div>
                    <h1>E-Ticket Perjalanan Saya</h1>
                    <p>Daftar tiket aktif yang siap digunakan untuk boarding otomatis berbasis biometrik wajah.</p>
                </div>
                <a href="/booking.html" class="btn" style="width: auto; min-width: 160px;">+ Pesan Tiket Baru</a>
            </div>
        </div>

        <div id="tickets" class="ticket-list">
            <div class="card" style="text-align: center; color: var(--muted); padding: 40px;">
                <div class="icon-box icon-box-navy" style="width: 50px; height: 50px; margin: 0 auto 16px;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                </div>
                Memuat data tiket perjalanan...
            </div>
        </div>
    </main>

    <script src="/static/js/auth.js"></script>
    <script>
        requireLogin();

        async function loadTickets() {
            const container = document.getElementById("tickets");

            try {
                const tickets = await apiRequest("/tickets/my-tickets");
                container.replaceChildren();

                if (!tickets.length) {
                    const emptyCard = document.createElement("div");
                    emptyCard.className = "card";
                    emptyCard.style.textAlign = "center";
                    emptyCard.style.padding = "48px 24px";
                    emptyCard.innerHTML = `
                        <!-- ILUSTRASI TIKET KOSONG -->
                        <div style="width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 50%; background: var(--orange-soft); display: flex; align-items: center; justify-content: center; color: var(--orange);">
                            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="2" y="6" width="20" height="12" rx="2"></rect>
                                <circle cx="2" cy="12" r="2" fill="currentColor"></circle>
                                <circle cx="22" cy="12" r="2" fill="currentColor"></circle>
                                <line x1="12" y1="6" x2="12" y2="18" stroke-dasharray="2 2"></line>
                            </svg>
                        </div>
                        <h3 style="margin-bottom: 8px;">Belum Ada Tiket Terdaftar</h3>
                        <p style="margin-bottom: 24px; max-width: 400px; margin-left: auto; margin-right: auto;">
                            Anda belum memiliki reservasi tiket kereta api. Pilih rute perjalanan dan pesan tiket Anda sekarang.
                        </p>
                        <a href="/booking.html" class="btn" style="display: inline-flex; width: auto; min-width: 200px;">Pesan Tiket Sekarang</a>
                    `;
                    container.appendChild(emptyCard);
                    return;
                }

                for (const ticket of tickets) {
                    const card = document.createElement("div");
                    card.className = "ticket-card";

                    const isBoarded = ticket.status === "BOARDED";
                    const statusBadgeClass = isBoarded ? "badge-boarded" : "badge-booked";
                    const statusText = ticket.status;

                    let departureInfo = "Hari Ini";
                    if (ticket.departure_time) {
                        const departureDate = new Date(
                            ticket.departure_time.endsWith("Z")
                                ? ticket.departure_time
                                : ticket.departure_time + "Z"
                        );
                        departureInfo = departureDate.toLocaleString("id-ID", {
                            timeZone: "Asia/Jakarta",
                            day: "2-digit",
                            month: "short",
                            year: "numeric",
                            hour: "2-digit",
                            minute: "2-digit",
                            hour12: false
                        }) + " WIB";
                    }

                    card.innerHTML = `
                        <!-- BAGIAN ATAS BOARDING PASS -->
                        <div class="ticket-top">
                            <div class="ticket-train-info">
                                <div class="icon-box" style="width: 34px; height: 34px;">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="4" y="3" width="16" height="15" rx="3"></rect>
                                        <line x1="8" y1="8" x2="16" y2="8"></line>
                                        <circle cx="8" cy="14" r="1.5" fill="currentColor"></circle>
                                        <circle cx="16" cy="14" r="1.5" fill="currentColor"></circle>
                                        <path d="M7 18 L4 21"></path>
                                        <path d="M17 18 L20 21"></path>
                                    </svg>
                                </div>
                                <div>
                                    <span class="ticket-train-name">${ticket.nama_kereta}</span>
                                    <span class="badge" style="background: var(--surface-alt); color: var(--navy); margin-left: 8px;">EKSEKUTIF</span>
                                </div>
                            </div>
                            <span class="badge ${statusBadgeClass}">
                                ${statusText}
                            </span>
                        </div>

                        <!-- RUTE PERJALANAN DENGAN VISUAL TRACK REL -->
                        <div class="ticket-route">
                            <div class="station-node">
                                <span class="station-label">Keberangkatan</span>
                                <span class="station-name">${ticket.asal}</span>
                            </div>

                            <div class="route-connector">
                                <div class="route-track">
                                    <div class="route-icon-badge">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                            <line x1="5" y1="12" x2="19" y2="12"></line>
                                            <polyline points="12 5 19 12 12 19"></polyline>
                                        </svg>
                                    </div>
                                </div>
                                <span style="font-size: 11px; color: var(--muted); margin-top: 6px; font-weight: 500;">
                                    Jalur Kereta Antarkota
                                </span>
                            </div>

                            <div class="station-node" style="text-align: right;">
                                <span class="station-label">Tujuan Akhir</span>
                                <span class="station-name">${ticket.tujuan}</span>
                            </div>
                        </div>

                        <!-- BAGIAN BAWAH BOARDING PASS DENGAN BARCODE SIMULASI -->
                        <div class="ticket-bottom">
                            <div>
                                <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <polyline points="12 6 12 12 16 14"></polyline>
                                    </svg>
                                    <span>Jadwal: <strong>${departureInfo}</strong></span>
                                </div>
                                <div class="booking-code-box" style="margin-top: 6px;">
                                    <span>Kode Booking:</span>
                                    <span class="booking-code-value">${ticket.booking_code}</span>
                                </div>
                            </div>

                            <!-- DEKORASI BARCODE RESMI TIKET KERETA -->
                            <div style="display: flex; flex-direction: column; align-items: flex-end;">
                                <div class="barcode-strip">
                                    <div class="barcode-bar" style="width: 2px;"></div>
                                    <div class="barcode-bar" style="width: 4px;"></div>
                                    <div class="barcode-bar" style="width: 1px;"></div>
                                    <div class="barcode-bar" style="width: 3px;"></div>
                                    <div class="barcode-bar" style="width: 1px;"></div>
                                    <div class="barcode-bar" style="width: 5px;"></div>
                                    <div class="barcode-bar" style="width: 2px;"></div>
                                    <div class="barcode-bar" style="width: 3px;"></div>
                                    <div class="barcode-bar" style="width: 1px;"></div>
                                    <div class="barcode-bar" style="width: 4px;"></div>
                                    <div class="barcode-bar" style="width: 2px;"></div>
                                    <div class="barcode-bar" style="width: 6px;"></div>
                                    <div class="barcode-bar" style="width: 1px;"></div>
                                    <div class="barcode-bar" style="width: 3px;"></div>
                                    <div class="barcode-bar" style="width: 2px;"></div>
                                    <div class="barcode-bar" style="width: 4px;"></div>
                                    <div class="barcode-bar" style="width: 1px;"></div>
                                </div>
                                <span style="font-size: 9px; color: var(--muted); letter-spacing: 0.1em; margin-top: 3px;">KAI BOARDING PASS</span>
                            </div>
                        </div>
                    `;

                    container.appendChild(card);
                }

            } catch (error) {
                container.innerHTML = `
                    <div class="card">
                        <p class="message error">${error.message}</p>
                    </div>
                `;
            }
        }

        loadTickets();
    </script>
</body>

</html>
