<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrasi Akun - RailGate</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="speed-stripes">
        <div class="stripe-navy"></div>
        <div class="stripe-orange"></div>
    </div>

    <nav>
        <a href="/index.html" class="brand">
            <span class="brand-icon-wrapper">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="3" width="16" height="15" rx="3"></rect>
                    <line x1="8" y1="8" x2="16" y2="8"></line>
                    <circle cx="8" cy="14" r="1.5" fill="currentColor"></circle>
                    <circle cx="16" cy="14" r="1.5" fill="currentColor"></circle>
                    <path d="M7 18 L4 21"></path>
                    <path d="M17 18 L20 21"></path>
                </svg>
            </span>
            <span>Rail<span class="brand-accent">Gate</span></span>
        </a>

        <div class="nav-links">
            <a href="/login.html">Masuk</a>
        </div>
    </nav>

    <div class="auth-layout">
        <div class="card auth-card">
            <div class="auth-header">
                <div class="brand-icon-wrapper" style="margin: 0 auto 12px; width: 44px; height: 44px;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="8.5" cy="7" r="4"></circle>
                        <line x1="20" y1="8" x2="20" y2="14"></line>
                        <line x1="23" y1="11" x2="17" y2="11"></line>
                    </svg>
                </div>
                <h2>Registrasi Akun Baru</h2>
                <p>Buat akun penumpang untuk menikmati layanan boarding cerdas.</p>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="nama">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        Nama Lengkap Sesuai KTP
                    </label>
                    <input id="nama" placeholder="Contoh: Budi Santoso" required minlength="2" maxlength="100">
                </div>

                <div class="form-group">
                    <label for="email">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        Alamat Email
                    </label>
                    <input id="email" type="email" placeholder="nama@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        Kata Sandi
                    </label>
                    <input id="password" type="password" placeholder="Minimal 8 karakter" minlength="8" required>
                </div>

                <button type="submit" class="btn">
                    Daftar Akun Penumpang
                </button>
            </form>

            <p id="message"></p>

            <div class="auth-footer">
                Sudah memiliki akun? <a href="/login.html">Masuk di sini</a>
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script>
        document.getElementById("registerForm")
            .addEventListener("submit", async (event) => {
                event.preventDefault();

                try {
                    await apiRequest("/auth/register", {
                        method: "POST",
                        body: JSON.stringify({
                            nama: document.getElementById("nama").value,
                            email: document.getElementById("email").value,
                            password: document.getElementById("password").value
                        })
                    });

                    showMessage(
                        "message",
                        "Registrasi berhasil! Silakan masuk ke akun Anda.",
                        true
                    );

                    setTimeout(() => {
                        window.location.href = "/login.html";
                    }, 1400);

                } catch (error) {
                    showMessage("message", error.message);
                }
            });
    </script>
</body>

</html>
